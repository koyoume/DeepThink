# ⚠️ 이관됨 — 이 워크플로는 비활성화되어 있다 (2026-08-17)
#
# 이 코드베이스는 koyoume/toolsmith 의 tools/deepthink/ 로 스냅샷 이관됐고,
# 배포는 그쪽 워크플로가 담당한다:
#   .github/workflows/deepthink-deploy-web.yml
#
# **두 repo가 같은 Cloudflare 대상(Pages 프로젝트 deepthink)을 향하므로 둘 다 켜 두면 서로 덮어쓴다.**
# 그래서 자동 트리거(on.push)를 지우고 수동 실행만 남겼다. 파일은 되돌리기 쉽게 보존한다.
# 이 디렉터리는 스냅샷이며 더 이상 갱신되지 않는다.

name: '[DISABLED — moved to toolsmith] Deploy Web'
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Verify domain logic (markdown codec + vault store golden cases)
        run: npm run verify:domain

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E gate (Playwright)
        run: npm run test:e2e

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ./dist --project-name deepthink --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
